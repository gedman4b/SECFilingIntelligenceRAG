<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SEC Filing Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>SEC Filing Intelligence</h1>
    <p class="subtitle">Grounded financial answers from PDF filings</p>
  </header>
 
  <main>
    <section class="query-section">
      <textarea id="question" placeholder="e.g. What was Tesla's net income growth between 2025 and 2026?"></textarea>
      <button id="submit">Ask</button>
    </section>
 
    <section id="response" class="response-section hidden">
      <div class="confidence-badge" id="confidence"></div>
      <div class="answer-text" id="answer-text"></div>
 
      <div class="calculation" id="calculation-block"></div>
 
      <div class="warnings" id="warnings-block"></div>
 
      <details class="citations">
        <summary>Sources and raw values</summary>
        <div id="citations-block"></div>
      </details>
    </section>
  </main>
 
  <script src="app.js"></script>
</body>
</html>
